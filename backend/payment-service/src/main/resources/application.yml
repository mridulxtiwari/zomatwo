server:
  port: ${PORT:8084}

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/zomato_payment_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_MIN:1}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: ${FLYWAY_TABLE:flyway_payment_history}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.zomatwo.common.events,java.util,java.lang"
    listener:
      auto-startup: ${KAFKA_ENABLED:false}

app:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_zomatwoKey123}
    key-secret: ${RAZORPAY_KEY_SECRET:sample_secret_key_mock_razorpay_signature}
  kafka:
    topics:
      order-events: order-events
      payment-events: payment-events

management:
  endpoints:
    web:
      exposure:
        include: health,info
